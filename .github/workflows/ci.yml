# Checks every push to alpha and every pull request: the API type-checks, builds and passes the
# smoke test against a real Postgres, and the web app builds.
name: CI

on:
  push:
    branches: [alpha]
  pull_request:

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentrust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # .env.example already points at postgres:postgres@localhost/rentrust, which is this job's database.
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
